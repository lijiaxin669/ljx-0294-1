version: '3.8'

services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: seating-planner-dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
    command: npm run dev -- --host
    stdin_open: true
    tty: true

  preview:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: seating-planner-preview
    ports:
      - "8080:80"
    environment:
      - NODE_ENV=production
    depends_on:
      - dev
